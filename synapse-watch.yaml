# What goworker mirrors of Synapse, for the nightly watch
# (.github/workflows/synapse-watch.yml, cmd/synapsewatch).
#
# Every night the newest Synapse release or rc tag is compared with
# `reviewed`; a change to any path below opens (or updates) one issue
# labelled synapse-watch. Port or dismiss what it lists, then set
# `reviewed` to the tag you checked against: the issue closes itself on
# the next run.
#
# Paths are files or directories in element-hq/synapse. Seeded on
# 2026-10-28 from the Synapse files our code cites; when you port from a
# file not listed here, add it.

reviewed: v1.164.1

components:
  # Shared by every part: tables we read and write.

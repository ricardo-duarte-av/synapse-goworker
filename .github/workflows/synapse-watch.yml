name: Synapse watch

# Every night: has a Synapse release or rc changed code goworker mirrors
# since each component's reviewed tag, other than the PRs handled
# (synapse-watch.yaml)? If so, one issue labelled synapse-watch lists the
# commits, by component. It is rebuilt when the list changes, and closed
# once nothing is left.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: synapse-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Commits, trees and tags; file contents are fetched only for the diffs.
      - name: Clone Synapse
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/element-hq/synapse synapse-src

      - name: Compare
        id: watch
        env:
          GOEXPERIMENT: jsonv2
        run: go run ./cmd/synapsewatch -manifest synapse-watch.yaml -synapse synapse-src -out report.md

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.watch.outputs.newest }}
          CHANGED: ${{ steps.watch.outputs.changed }}
        run: |
          gh label create synapse-watch --color d93f0b \
            --description "Synapse changed code goworker mirrors" --force >/dev/null
          title="Synapse $NEWEST: changes to code goworker mirrors"
          # The report's hash, so a changed list (a new tag, or handled PRs
          # added to the manifest) rebuilds the issue and an unchanged one
          # leaves it, and anything ticked on it, alone.
          marker="<!-- synapse-watch $(sha256sum report.md | cut -c1-16) -->"
          printf '\n%s\n' "$marker" >> report.md
          number=$(gh issue list --label synapse-watch --state open --json number --jq '.[0].number // empty')

          if [ "$CHANGED" = "true" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --label synapse-watch --body-file report.md
            elif ! gh issue view "$number" --json body --jq .body | grep -qF "$marker"; then
              current=$(gh issue view "$number" --json title --jq .title)
              gh issue edit "$number" --title "$title" --body-file report.md
              if [ "$current" != "$title" ]; then
                gh issue comment "$number" --body "Updated for $NEWEST."
              fi
            else
              echo "Issue #$number is up to date."
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing left to review up to $NEWEST: every change is reviewed or handled in synapse-watch.yaml."
          else
            echo "Nothing to review up to $NEWEST."
          fi

name: Synapse watch

# Every night: has a Synapse release or rc changed code goworker mirrors
# since the release we last reviewed (synapse-watch.yaml)? If so, one issue
# labelled synapse-watch lists the commits, by component. It is retitled
# when a newer tag adds to it, and closed once `reviewed` catches up.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: synapse-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Commits, trees and tags; file contents are fetched only for the diffs.
      - name: Clone Synapse
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/element-hq/synapse synapse-src

      - name: Compare
        id: watch
        env:
          GOEXPERIMENT: jsonv2
        run: go run ./cmd/synapsewatch -manifest synapse-watch.yaml -synapse synapse-src -out report.md

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.watch.outputs.newest }}
          CHANGED: ${{ steps.watch.outputs.changed }}
        run: |
          gh label create synapse-watch --color d93f0b \
            --description "Synapse changed code goworker mirrors" --force >/dev/null
          title="Synapse $NEWEST: changes to code goworker mirrors"
          number=$(gh issue list --label synapse-watch --state open --json number --jq '.[0].number // empty')
          current=$(test -n "$number" && gh issue view "$number" --json title --jq .title || true)

          if [ "$CHANGED" = "true" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --label synapse-watch --body-file report.md
            elif [ "$current" != "$title" ]; then
              # A newer tag: the list is rebuilt from reviewed, so boxes
              # ticked on the old one are not kept.
              gh issue edit "$number" --title "$title" --body-file report.md
              gh issue comment "$number" --body "Updated for $NEWEST."
            else
              echo "Issue #$number is already about $NEWEST."
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "synapse-watch.yaml's reviewed tag has caught up with $NEWEST: nothing left to review."
          else
            echo "Nothing to review: reviewed is $NEWEST or what changed since is not ours."
          fi

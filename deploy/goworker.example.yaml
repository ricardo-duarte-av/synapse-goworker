# goworker.yaml -- the one config file.
#
# Nothing here says WHAT the worker does. nginx decides which requests reach
# it (see nginx.conf.example), and homeserver.yaml decides whether it sends
# federation: it does while federation_sender_instances lists instance_name.
# Everything Synapse also needs to agree on (server_name, redis, stream
# writers, the signing key, experimental_features, retry timings) is read
# from homeserver.yaml.

homeserver_yaml: /etc/synapse/homeserver.yaml
instance_name: av-goworker-1

listen:
  # Client and federation paths share one socket; they never overlap.
  socket: /var/sockets/nginx/goworker.sock
  socket_mode: "0666"          # nginx runs as another uid
  metrics:
    addr: ":9200"              # /metrics, /health, /debug/pprof -- internal only
    pprof: true

upstream:
  # Synapse's main process: the fallback for everything not answered here.
  sockets: [/var/sockets/nginx/av-synapse-main.sock]
  timeout_seconds: 180         # /state on the largest room takes ~82s on main

database:
  # Unset: every pool connects as homeserver.yaml's database block does --
  # through pgcat, as Synapse's user. pgx runs in Exec mode throughout, and
  # nothing relies on session state, so a transaction pooler is fine.
  # dsn: "host=matrix-pgcat port=6432 user=synapse dbname=synapse-db"
  connect_timeout_seconds: 10
  pools:                       # client connections; pgcat's pool_size is the real bound
    read: 16                   # each of sync, federation reads, sender, unless sized below
    # Separate pools on purpose: an initial sync holding all of sync's
    # connections cannot take the sender's. Unset takes read.
    # sync_read: 16
    # federation_reads_read: 16
    # sender_read: 16
    to_device: 4
    sliding_sync: 8
    sender_write: 8
    sender_state: 4
    inbound_read: 4
    inbound_pdu: 4
    inbound_write: 4
    client_auth: 4             # access token lookups, and marking a token used

memory:
  limit_mb: 3072               # GOMEMLIMIT; caches below must fit well inside it
  # The one cache of state groups' full state, shared by the federation
  # reads (/state, /state_ids) and inbound write mode (auth, state res, push).
  state_cache_mb: 768
  # Which state group each event is at, shared by sync and the federation reads.
  event_group_cache_mb: 32

log:
  level: info                  # trace, debug, info, warn, error, disabled
  # Per part, overriding level; the name is the "component" its lines carry.
  # Parts: sync, federation_reads, inbound, sender, bus, proxy.
  #components:
  #  sender: error              # its warnings are mostly remote servers failing
  #  sync: info
  pretty: false

sync:
  filter_timeline_limit: 1000
  to_device: true
  sliding_sync:
    enabled: true
    reap_interval_minutes: 60
  auth:                        # platform/clientauth, for every client-API part
    positive_ttl: 5m           # a lookup kept without an invalidation; and /whoami's yes
    negative_ttl: 30s          # /whoami's no
    max_entries: 20000         # /whoami's answers

federation_reads:
  native_timeout_seconds: 5
  stream_timeout_seconds: 900
  stream_idle_timeout_seconds: 60
  caches:                      # MB; state groups are memory.state_cache_mb
    events_mb: 128
    auth_chains_mb: 256
    filtered_state_mb: 64

inbound:
  missing_events: fetch
  mark_origins_up: true
  fallback: synapse

sender:
  presence_batch_max_wait_seconds: 0

limits:
  # Concurrent work, sized by what one unit holds. Defaults shown; they bind
  # only in an overload. See internal/platform/limits.
  sync_requests: 20000         # past it: 503 + Retry-After
  initial_syncs: 4             # wait: one is 1.5GB for a 654-room account
  federation_reads: 256        # wait 5s, then 429
  state_streams: 4             # wait: a /state answer is up to 97MB
  inbound_transactions: 64     # wait
  sender_destinations: 2000
  sender_catchup: 32
